apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // React Native configuration
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.videoplayer"
    defaultConfig {
        applicationId "com.videoplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
    }
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation("com.facebook.react:react-android")
    implementation "androidx.core:core:1.10.1"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // ExoPlayer is NOT used by react-native-video 5.x (which uses MediaPlayer/ScalableVideoView).
    // Removed to avoid potential class conflicts and APK bloat.
    // implementation "com.google.android.exoplayer:exoplayer:2.18.7"
    // implementation "com.google.android.exoplayer:exoplayer-core:2.18.7"
    // implementation "com.google.android.exoplayer:exoplayer-dash:2.18.7"
    // implementation "com.google.android.exoplayer:exoplayer-hls:2.18.7"
    // implementation "com.google.android.exoplayer:exoplayer-smoothstreaming:2.18.7"
    // implementation "com.google.android.exoplayer:exoplayer-ui:2.18.7"
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
